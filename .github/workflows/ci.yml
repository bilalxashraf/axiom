name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-flow-conformance:
    name: Control-flow conformance / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.12.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run focused control-flow conformance suite
        run: npm run test:control-flow

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.12.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Type-check, build, and test
        run: npm run check

      - name: Run determinism conformance suite
        run: npm run test:determinism

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage

      - name: Audit production dependency graph
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=high

      - name: Verify reproducible installable package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run package:verify
